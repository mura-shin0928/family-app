name: CI

on:
  push:
    branches: [main]
    # ドキュメントだけの変更でCI/migrationを回さない。
    # GitHub ActionsはYAMLアンカーを解釈しないため、push/pull_requestで同じ内容を書く。
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # service role key (管理・migration専用、RLSをbypassする) がクライアント到達可能な
      # src/ に紛れ込むと、ブラウザへ権限が露出する致命的な事故になる。scripts/ 側でのみ使う。
      - name: Ensure service role key is never referenced from app code
        run: |
          if grep -rn "SERVICE_ROLE" src/; then
            echo "SERVICE_ROLE_KEY must never be referenced from src/ (client-reachable code)." >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint:ci

      - run: npm run test

      - run: npm run build

  migrate:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # 並行して進むworktree/PRごとにmigrationのタイムスタンプが前後することがあるため、
      # 「直前に適用したmigrationより古い日付のファイルを検出したら止める」安全チェックは
      # 常時bypassする（--include-all）。中身は各migrationファイル自体の内容で守られており、
      # 順序チェックはこのプロジェクトの開発体制とは噛み合わないため。
      - run: supabase db push --include-all --yes
