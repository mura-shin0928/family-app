name: DB types

# migration を空のDBに全部当て、そこから生成した型がコミット済みのものと一致するかを見る。
# 列の削除・改名のあと型を作り直し忘れると、古い型のままコンパイルが通ってしまうため。
on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/lib/supabase/database.types.ts"
      - ".github/workflows/db-types.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 既定の public.ecr.aws は、共有IPのランナーからだと取得がレート制限に掛かる。
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 生成結果の書式は CLI の版で変わる。手元で型を生成した版と揃える。
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.114.0

      - run: supabase db start

      - run: npm run db:types

      - name: Ensure committed types match the migrations
        run: |
          if ! git diff --exit-code -- src/lib/supabase/database.types.ts; then
            echo "database.types.ts が migration と一致しません。make db-reset のあと npm run db:types を実行してコミットしてください。" >&2
            exit 1
          fi
