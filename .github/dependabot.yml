version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # 一緒に上げないと型や peer dependency がずれる組
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      mui:
        patterns: ["@mui/*", "@emotion/*"]
      # 上記以外の minor / patch は1本のPRにまとめる
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 型は実行環境の Node (.node-version) に合わせる。major は Node を上げるときに手で上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
